name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, with or without a leading v (for example v0.1.0)."
        required: true
      push_nuget:
        description: "Push the package to NuGet. Turn off to cut a GitHub release only."
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

# One release at a time. Two runs for the same new version can both see the tag missing
# and build different refs, and the second would clobber the first one's asset. Releases
# are rare enough that a single lane costs nothing, and cancelling is not an option here
# because a cancelled run can leave a release published with no package attached.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0

      - name: Resolve version from tag
        id: version
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          version="${TAG#v}"
          pre='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$pre(\.$pre)*)?$ ]]; then
            echo "Tag '$TAG' is not vMAJOR.MINOR.PATCH with an optional prerelease suffix." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check out the existing tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A retry of an already tagged version must build that tag, not whatever
          # ref the dispatch selected. A tag that does not exist yet is created later
          # from this commit, so leaving the checkout alone is correct there. Probe
          # for the tag separately, because folding the probe into the fetch would
          # let a network failure look like an absent tag and quietly ship a package
          # built from the wrong commit.
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null; then
            git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --detach --force "$TAG"
          elif [ $? -ne 2 ]; then
            echo "Could not determine whether tag '$TAG' exists." >&2
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: dotnet build --configuration Release --no-restore -p:Version="$VERSION"

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: dotnet pack src/AgenticRoslynTool/AgenticRoslynTool.csproj --configuration Release --no-build --output artifacts -p:Version="$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Immutable releases are on, so a published release cannot be changed and its
          # tag name can never be reused. That shapes all three branches below.
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = false ]; then
            # Already published. Leave it alone and let the NuGet push retry.
            echo "Release $TAG is already published, leaving it untouched." >&2
            exit 0
          fi
          if [ "$state" = true ]; then
            # A draft is a run that died before publishing. It holds no tag, so it is
            # safe to drop and rebuild.
            gh release delete "$TAG" --yes
          fi
          # Publish in two steps. Creating a release publishes the tag, and a create that
          # dies while uploading would burn that tag name on a release with no package on
          # it. A draft carries no tag, so a failure here is recoverable.
          gh release create "$TAG" artifacts/*.nupkg \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --draft
          gh release edit "$TAG" --draft=false

      - name: NuGet login
        if: github.event_name != 'workflow_dispatch' || inputs.push_nuget
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: rjmurillo

      - name: Push to NuGet
        if: github.event_name != 'workflow_dispatch' || inputs.push_nuget
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
