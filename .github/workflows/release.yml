name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, with or without a leading v (for example v0.1.0)."
        required: true
      push_nuget:
        description: "Push the package to NuGet. Turn off to cut a GitHub release only."
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0

      - name: Resolve version from tag
        id: version
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          version="${TAG#v}"
          pre='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$pre(\.$pre)*)?$ ]]; then
            echo "Tag '$TAG' is not vMAJOR.MINOR.PATCH with an optional prerelease suffix." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: dotnet build --configuration Release --no-restore -p:Version="$VERSION"

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: dotnet pack src/AgenticRoslynTool/AgenticRoslynTool.csproj --configuration Release --no-build --output artifacts -p:Version="$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.nupkg --clobber
          else
            gh release create "$TAG" artifacts/*.nupkg \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi

      - name: NuGet login
        if: inputs.push_nuget != false
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: rjmurillo

      - name: Push to NuGet
        if: inputs.push_nuget != false
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
