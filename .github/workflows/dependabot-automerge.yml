name: Dependabot auto-merge

# Dependabot opens security updates only, see .github/dependabot.yml. A pull request
# opens at once. Minor and patch fixes can merge once the repository ruleset passes.
# The schedule retries open pull requests if the event run did not enable auto-merge.
on:
  pull_request:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  automerge:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge for non-major updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -n "$EVENT_PR" ]; then
            prs="$EVENT_PR"
          else
            prs=$(gh pr list --author app/dependabot --state open --json number --jq '.[].number')
          fi

          for pr in $prs; do
            if [ "$(gh pr view "$pr" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
              echo "#$pr: auto-merge already enabled."
              continue
            fi

            # Central Package Management puts every version in Directory.Packages.props,
            # so the diff of that file is the full list of updates.
            diff=$(gh pr diff "$pr")
            pattern='s/^([+-])[[:space:]]*<PackageVersion Include="([^"]+)" Version="([^"]+)".*/\1 \2 \3/p'
            changes=$(printf '%s\n' "$diff" | sed -nE "$pattern")
            added=$(printf '%s\n' "$changes" | awk '$1 == "+" { print $2, $3 }')
            if [ -z "$added" ]; then
              echo "#$pr: no PackageVersion change found, leaving it for a human."
              continue
            fi

            ready=true
            while read -r id version; do
              if ! [[ "$id" =~ ^[A-Za-z0-9._-]+$ && "$version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
                echo "#$pr: unexpected package id or version '$id' '$version'."
                ready=false
                break
              fi
              old=$(printf '%s\n' "$changes" | awk -v id="$id" '$1 == "-" && $2 == id { print $3 }')
              if [ -z "$old" ] || [ "${old%%.*}" != "${version%%.*}" ]; then
                echo "#$pr: $id ${old:-new} to $version is a new or major update, leaving it for a human."
                ready=false
                break
              fi
            done <<< "$added"

            if [ "$ready" = true ]; then
              gh pr merge --auto --squash "$pr"
              echo "#$pr: auto-merge enabled."
            fi
          done
